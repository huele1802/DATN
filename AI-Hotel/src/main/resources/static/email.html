    <title>Mã OTP Xác Thực</title>

<body style="margin: 0; padding: 0; background-color: #f4f4f4;">
<div style="background-color: #FFFFCC; padding: 20px 0;">
    <div style="max-width: 600px; width: 100%; margin: 0 auto; background-color: #ffffff; border-radius: 8px; padding: 20px; box-sizing: border-box;">
        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="https://res.cloudinary.com/dy8p5yjsd/image/upload/v1746957250/ubinkaekeqvrdzmvpky3.jpg" alt="Unime Hospital Logo" style="width: 150px; height: auto;">

        <!-- Tiêu đề -->
        <div style="text-align: center; margin-bottom: 10px;">
            <h1 style="color: #333333; font-family: Arial, sans-serif; margin: 0; font-size: 24px; font-weight: bold;">
                Mã xác thực
            </h1>
        </div>

        <!-- Thông điệp -->
        <div style="text-align: center; margin-bottom: 10px;">
            <p style="color: #666666; font-family: Arial, sans-serif; font-size: 16px; line-height: 24px; margin: 0;">
                Vui lòng sử dụng mã OTP sau để xác minh tài khoản của bạn:
            </p>
        </div>

        <!-- OTP Code -->
        <div style="background-color: #DDDDDD; border-radius: 4px; padding: 15px; margin-bottom: 20px; text-align: center;">
                <span style="font-family: 'Courier New', monospace; font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #000000;">
                    {{OTP}}
                </span>
            <p style="color: #666666; font-family: Arial, sans-serif; font-size: 14px; line-height: 20px; margin: 10px 0 0 0;">
                Mã OTP này có hiệu lực trong 10 phút.<br>
                Nếu bạn không yêu cầu mã này, vui lòng bỏ qua email này.
            </p>
        </div>
